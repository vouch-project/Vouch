# Requires Docker Compose v2.24+ (object-form env_file with required: false is used below).
services:
  # ─────────────────────────────────────────────
  # Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro

  # ─────────────────────────────────────────────
  # Applications
  # ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    depends_on:
      - redis
    env_file:
      - .env
      - path: /etc/vouch/secrets.env
        required: false
    environment:
      NODE_ENV: production
      RPC_URL: http://hardhat-node:8545
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_ENGINE_URL: http://ml-engine:8001
      SUPABASE_EC_PRIVATE_KEY_PATH: /run/secrets/supabase_ec_private.pem
      SUPABASE_EC_PUBLIC_KEY_PATH: /run/secrets/supabase_ec_public.pem
    volumes:
      - type: bind
        source: ${SUPABASE_EC_PRIVATE_KEY_PATH:?SUPABASE_EC_PRIVATE_KEY_PATH is required}
        target: /run/secrets/supabase_ec_private.pem
        read_only: true
      - type: bind
        source: ${SUPABASE_EC_PUBLIC_KEY_PATH:?SUPABASE_EC_PUBLIC_KEY_PATH is required}
        target: /run/secrets/supabase_ec_public.pem
        read_only: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    env_file: .env
    environment:
      NODE_ENV: production
      PUBLIC_BACKEND_API_URL: https://$SERVER_HOST/api

  ml-engine:
    build:
      context: .
      dockerfile: apps/ml-engine/Dockerfile
    restart: unless-stopped
    expose:
      - '8001'
    env_file:
      - .env
      - path: /etc/vouch/secrets.env
        required: false
    volumes:
      # Run `vouch-ml-training train` first. ml-engine starts without a model (returns 503) if empty.
      - type: bind
        source: ./services/ml-training/src/vouch_ml_training/models/artifacts
        target: /app/artifacts
        read_only: true
        bind:
          create_host_path: false

  keeper:
    build:
      context: .
      dockerfile: apps/keeper/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      RPC_URL: http://hardhat-node:8545

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    env_file:
      - .env
      - path: /etc/vouch/secrets.env
        required: false
    command: sh -c 'test -n "$$REDIS_PASSWORD" || { echo "REDIS_PASSWORD is required" >&2; exit 1; }; exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'

volumes:
  redis_data:
