services:
  # ─────────────────────────────────────────────
  # Reverse Proxy
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro

  # ─────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────
  hardhat-node:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - '8545:8545'
    volumes:
      - ./packages/contracts:/app

  # ─────────────────────────────────────────────
  # Applications
  # ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    env_file: .env
    environment:
      NODE_ENV: production
      RPC_URL: http://hardhat-node:8545
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ML_ENGINE_URL: http://ml-engine:8001

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    env_file: .env
    environment:
      NODE_ENV: production
      PUBLIC_BACKEND_API_URL: https://$SERVER_HOST/api

  ml-engine:
    build:
      context: .
      dockerfile: apps/ml-engine/Dockerfile
    restart: unless-stopped
    expose:
      - '8001'
    env_file: .env
    volumes:
      # Requires trained artifacts to exist locally under services/ml-training/.../models/artifacts (if missing, Docker may create an empty directory and ml-engine will start without a model)
      - ./services/ml-training/src/vouch_ml_training/models/artifacts:/app/artifacts:ro

  keeper:
    build:
      context: .
      dockerfile: apps/keeper/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      RPC_URL: http://hardhat-node:8545
    depends_on:
      hardhat-node:
        condition: service_started

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'yes',
      ]

volumes:
  redis_data:
