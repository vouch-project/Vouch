[project]
name = "vouch-ml-training"
version = "0.1.0"
description = "ETL pipeline + XGBoost trainer for the Vouch cold-start credit scoring model"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "tenacity>=9.0.0",
    "supabase>=2.10.0",
    "polars>=1.18.0",
    "numpy>=2.0.0",
    "pyarrow>=18.0.0",
    "xgboost>=2.1.0",
    "scikit-learn>=1.6.0",
    "joblib>=1.4.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "respx>=0.22.0",
]

[project.scripts]
vouch-ml-training = "vouch_ml_training.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
