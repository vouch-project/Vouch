[project]
name = "vouch-keeper"
version = "0.1.0"
description = "Vouch Protocol Keeper / Liquidation Bot"
requires-python = ">=3.11"
dependencies = [
    "web3>=7.6.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

# Dependency-only install: the keeper runs via `python main.py` from its source dir, so it does not
# need its modules packaged. An empty list disables setuptools' flat-layout auto-discovery (which
# would otherwise error on the multiple top-level .py files) without requiring the source files to
# exist at build time — the Dockerfile installs deps from pyproject.toml before copying the source.
[tool.setuptools]
py-modules = []
